name: Check and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: kubectl kustomize k8s > /tmp/manifests.yaml
  images:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, bot]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: ${{ matrix.app }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/dungeon-crew-${{ matrix.app }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - if: github.event_name == 'push'
        run: echo "${{ steps.build.outputs.digest }}" > digest-${{ matrix.app }}
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.app }}
          path: digest-${{ matrix.app }}
          retention-days: 1
  # Promotes the images just built: pins their digests in k8s/kustomization.yaml
  # on main, which Argo CD then syncs. A push made with GITHUB_TOKEN starts no
  # new workflow run, so this cannot loop.
  deploy:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Pin image digests
        env:
          OWNER: ${{ github.repository_owner }}
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          # Runs can finish out of order. Only the newest change may promote,
          # ignoring earlier promotions of the pins themselves.
          newest=$(git log --first-parent -1 --format=%H -- . ':(exclude)k8s/kustomization.yaml')
          if [ "$newest" != "$GITHUB_SHA" ]; then
            echo "main has moved on to $newest; leaving promotion to that run."
            exit 0
          fi
          file=k8s/kustomization.yaml
          for app in web bot; do
            digest=$(cat "$DIGESTS/digest-$app")
            case "$digest" in sha256:*) ;; *) echo "No digest for $app"; exit 1 ;; esac
            # The digest line directly follows the image's name line.
            sed -i -E "\\|name: ghcr.io/$OWNER/dungeon-crew-$app\$|{n;s|digest: .*|digest: $digest|}" "$file"
            grep -q "digest: $digest" "$file" || { echo "Could not pin $app in $file"; exit 1; }
          done
          kubectl kustomize k8s > /dev/null
          if git diff --quiet; then
            echo "Digests unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Deploy ${GITHUB_SHA::7}"
          git push origin HEAD:main
