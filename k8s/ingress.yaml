apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dungeon-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [dungeon-crew.de]
      secretName: dungeon-crew-tls
  rules:
    - host: dungeon-crew.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dungeon-web
                port:
                  name: http
