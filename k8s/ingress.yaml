apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tavern-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [tavern-crew.de]
      secretName: tavern-crew-tls
  rules:
    - host: tavern-crew.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tavern-web
                port:
                  name: http
